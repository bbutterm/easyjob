# Обратный прокси nginx. Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/career-assistant
#   sudo ln -s /etc/nginx/sites-available/career-assistant /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Сертификат: sudo certbot --nginx -d example.ru
# В .env приложения поставьте TRUST_PROXY=1, чтобы cookie получила флаг Secure.

server {
    listen 80;
    server_name example.ru;

    # Certbot добавит блок с 443 и перенаправление сам.

    # Заголовки безопасности. HSTS включайте после того, как заработал HTTPS.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP — адрес клиента, каким его видит nginx. Приложение берёт его
        # при TRUST_PROXY=1; левые части X-Forwarded-For клиент может подделать.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Потоковые ответы интервью: не буферизовать.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    client_max_body_size 1m;
}
