# Обратный прокси nginx. Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/career-assistant
#   sudo ln -s /etc/nginx/sites-available/career-assistant /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Сертификат: sudo certbot --nginx -d example.ru
# В .env приложения поставьте TRUST_PROXY=1, чтобы cookie получила флаг Secure.

server {
    listen 80;
    server_name example.ru;

    # Certbot добавит блок с 443 и перенаправление сам.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Потоковые ответы интервью: не буферизовать.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    client_max_body_size 1m;
}
