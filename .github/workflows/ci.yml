name: Проверки

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить Chromium для Playwright
        run: npx playwright install --with-deps chromium

      - name: Проверить, что собранный index.html не отстал от исходников
        run: |
          node build.js
          git diff --exit-code index.html \
            || (echo "index.html не пересобран после правок в src/. Запустите: node build.js" && exit 1)

      - name: Проверить, что docs/ai-variables.md не отстал от кода
        run: |
          node tools/gen-ai-docs.js
          git diff --exit-code docs/ai-variables.md \
            || (echo "Документация переменных устарела. Запустите: node tools/gen-ai-docs.js" && exit 1)

      - name: Общий слой
        run: npm run test:shared

      - name: Управление контекстом
        run: npm run test:context
      - name: Импорт вакансии по ссылке (границы SSRF, разбор)
        run: npm run test:import
      - name: Живое интервью (деление, очередь синтеза, серверный синтез)
        run: npm run test:voice
      - name: Адаптер hh.ru (ссылки, API, разбор резюме, поиск, маршруты)
        run: npm run test:hh
      - name: Адаптер hh.ru через браузер сервера (Chromium, режимы, извлечение моделью)
        run: npm run test:hh:browser

      - name: Сервер
        run: npm run test:server

      - name: Веб-макет (демо-режим)
        run: npm run test:web

      - name: Веб-макет против сервера (режим сервера)
        run: npm run test:live

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установить зависимости
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Программа для компьютера
        run: xvfb-run -a npm run test:desktop
