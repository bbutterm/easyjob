  /* ---------------- Мастер создания резюме ---------------- */

  var STEP_NAMES = ['Профессия', 'Опыт', 'Навыки', 'Образование', 'Предпросмотр'];

  function stepsBar(current) {
    return '<ul class="steps">' + STEP_NAMES.map(function (name, index) {
      var cls = 'step' + (index < current ? ' step--done' : '');
      return '<li><button type="button" class="' + cls + '"'
        + (index === current ? ' aria-current="step"' : '')
        + ' data-act="builder:goto" data-step="' + index + '">'
        + '<span class="step__num">' + (index + 1) + '</span>' + esc(name) + '</button></li>';
    }).join('') + '</ul>';
  }

  function resumeWizard() {
    var state = Store.get();
    var b = state.builder;
    var body;

    if (b.built) return builtPreview(b);

    if (b.step === 0) {
      body = ''
        + UI.field({ id: 'b-profession', label: 'Желаемая профессия', model: 'builder.data.profession',
            value: b.data.profession, required: true, error: b.errors.profession,
            placeholder: 'Например: бизнес-аналитик',
            hint: 'Можно указать любую профессию — макет не ограничен одним направлением.' })
        + UI.field({ id: 'b-wishes', label: 'Пожелания к работе', model: 'builder.data.wishes', type: 'textarea',
            value: b.data.wishes, placeholder: 'Формат работы, отрасль, город, что важно в команде',
            hint: 'Свободный текст. Он подставляется в предпросмотр как есть.' })
        + UI.field({ id: 'b-summary', label: 'Коротко о себе', model: 'builder.data.summary', type: 'textarea',
            value: b.data.summary, placeholder: 'Две-три строки о вашей специализации',
            hint: 'Пишите своими словами: макет не придумывает за вас достижения.' });
    } else if (b.step === 1) {
      var items = b.data.experience.map(function (item, index) {
        return ''
          + '<div class="card" style="background:var(--surface-2)">'
          + '  <div class="card__head"><div class="card__title"><h3>Место работы ' + (index + 1) + '</h3></div>'
          + '    <button type="button" class="btn btn--sm btn--danger" data-act="builder:exp-remove" data-index="'
          + index + '">Удалить</button></div>'
          + '  <div class="grid-2">'
          + UI.field({ id: 'exp-role-' + index, label: 'Должность', model: 'builder.data.experience.' + index + '.role',
              value: item.role, required: true, error: b.errors['exp' + index] })
          + UI.field({ id: 'exp-company-' + index, label: 'Компания', model: 'builder.data.experience.' + index + '.company',
              value: item.company })
          + '  </div>'
          + UI.field({ id: 'exp-period-' + index, label: 'Период', model: 'builder.data.experience.' + index + '.period',
              value: item.period, placeholder: '2022 — настоящее время' })
          + UI.field({ id: 'exp-details-' + index, label: 'Что вы делали', type: 'textarea',
              model: 'builder.data.experience.' + index + '.details', value: item.details,
              placeholder: 'Задачи, за которые вы отвечали' })
          + '</div>';
      }).join('');
      body = (items || note('info', '<div>Пока не добавлено ни одного места работы.</div>'))
        + (b.errors.experience ? '<p class="field__error">' + esc(b.errors.experience) + '</p>' : '')
        + '<div class="btn-row" style="margin-top:16px">'
        + '<button type="button" class="btn" data-act="builder:exp-add">Добавить место работы</button></div>';
    } else if (b.step === 2) {
      body = ''
        + UI.field({ id: 'b-skills', label: 'Навыки', model: 'builder.data.skills', type: 'textarea',
            value: b.data.skills, required: true, error: b.errors.skills,
            placeholder: 'По одному навыку в строке',
            hint: 'Каждая строка станет отдельным пунктом в предпросмотре.' })
        + UI.field({ id: 'b-ach', label: 'Достижения', model: 'builder.data.achievements', type: 'textarea',
            value: b.data.achievements, placeholder: 'По одному достижению в строке',
            hint: 'Указывайте только то, что было на самом деле. Макет ничего не дописывает за вас.' });
    } else if (b.step === 3) {
      var edu = b.data.education.map(function (item, index) {
        return ''
          + '<div class="card" style="background:var(--surface-2)">'
          + '  <div class="card__head"><div class="card__title"><h3>Образование ' + (index + 1) + '</h3></div>'
          + '    <button type="button" class="btn btn--sm btn--danger" data-act="builder:edu-remove" data-index="'
          + index + '">Удалить</button></div>'
          + '  <div class="grid-2">'
          + UI.field({ id: 'edu-place-' + index, label: 'Учебное заведение',
              model: 'builder.data.education.' + index + '.place', value: item.place })
          + UI.field({ id: 'edu-program-' + index, label: 'Программа',
              model: 'builder.data.education.' + index + '.program', value: item.program })
          + '  </div>'
          + UI.field({ id: 'edu-period-' + index, label: 'Период',
              model: 'builder.data.education.' + index + '.period', value: item.period })
          + '</div>';
      }).join('');
      body = (edu || note('info', '<div>Раздел можно оставить пустым.</div>'))
        + '<div class="btn-row" style="margin-top:16px">'
        + '<button type="button" class="btn" data-act="builder:edu-add">Добавить образование</button></div>';
    } else {
      body = ''
        + note('demo', '<div><strong>Дальше — демонстрационная сборка.</strong> Ваши поля подставятся в предпросмотр '
          + 'без изменений. Текст, помеченный как образец ИИ, — фиксированный пример, а не результат анализа ваших данных.</div>')
        + previewCard(builderToResume(b), false)
        + '<div class="btn-row" style="margin-top:16px">'
        + '<button type="button" class="btn btn--primary" data-act="builder:build">Собрать резюме</button></div>';
    }

    var nav = ''
      + '<div class="btn-row btn-row--between" style="margin-top:24px">'
      + '  <button type="button" class="btn" data-act="builder:prev"' + (b.step === 0 ? ' disabled' : '') + '>Назад</button>'
      + (b.step < 4
          ? '<button type="button" class="btn btn--primary" data-act="builder:next">Далее</button>'
          : '<span></span>')
      + '</div>';

    return ''
      + pageHead('Создание резюме', 'Пошаговая форма. Введённое сохраняется при переходах между шагами внутри макета.')
      + stepsBar(b.step)
      + '<div class="card">' + body + nav + '</div>'
      + note('demo', '<div>После перезагрузки страницы введённый текст сбрасывается: макет не сохраняет '
        + 'персональные данные ни на сервере, ни в браузере.</div>');
  }

  function splitLines(text) {
    return String(text || '').split('\n').map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  function builderToResume(b) {
    return {
      id: 'builder-preview',
      title: (b.data.profession || 'Резюме') + ' — черновик',
      source: 'created',
      demo: false,
      profession: b.data.profession,
      wishes: b.data.wishes,
      summary: b.data.summary,
      experience: b.data.experience,
      skills: splitLines(b.data.skills),
      achievements: splitLines(b.data.achievements),
      education: b.data.education
    };
  }

  function previewCard(resume, showSample) {
    var exp = (resume.experience || []).filter(function (e) { return e.role || e.company; });
    return ''
      + '<div class="resume-preview">'
      + '  <h3>' + esc(resume.profession || 'Профессия не указана') + '</h3>'
      + '  <p class="muted">' + escLines(resume.wishes || 'Пожелания не указаны') + '</p>'
      + '  <div class="resume-preview__section"><h4>О себе</h4><p>'
      + (resume.summary ? escLines(resume.summary) : '<span class="faint">Не заполнено</span>') + '</p></div>'
      + '  <div class="resume-preview__section"><h4>Опыт</h4>'
      + (exp.length
          ? '<ul class="list">' + exp.map(function (e) {
              return '<li><b>' + esc(e.role || 'Должность не указана') + '</b>'
                + (e.company ? ' — ' + esc(e.company) : '')
                + (e.period ? '<div class="row-item__meta">' + esc(e.period) + '</div>' : '')
                + (e.details ? '<div>' + escLines(e.details) + '</div>' : '') + '</li>';
            }).join('') + '</ul>'
          : '<p class="faint">Не заполнено</p>')
      + '  </div>'
      + '  <div class="resume-preview__section"><h4>Навыки</h4>'
      + ((resume.skills || []).length
          ? '<ul>' + resume.skills.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>'
          : '<p class="faint">Не заполнено</p>')
      + '  </div>'
      + ((resume.achievements || []).length
          ? '<div class="resume-preview__section"><h4>Достижения</h4><ul>'
            + resume.achievements.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>'
          : '')
      + '  <div class="resume-preview__section"><h4>Образование</h4>'
      + ((resume.education || []).filter(function (e) { return e.place || e.program; }).length
          ? '<ul class="list">' + resume.education.filter(function (e) { return e.place || e.program; })
              .map(function (e) {
                return '<li><b>' + esc(e.place || '') + '</b>'
                  + (e.program ? ' — ' + esc(e.program) : '')
                  + (e.period ? '<div class="row-item__meta">' + esc(e.period) + '</div>' : '') + '</li>';
              }).join('') + '</ul>'
          : '<p class="faint">Не заполнено</p>')
      + '  </div>'
      + (showSample
          ? '<div class="resume-preview__section">'
            + '<h4>Образец формулировки <span class="tag tag--demo">Фиксированный пример, не ИИ</span></h4>'
            + '<p class="muted">«Бизнес-аналитик: собираю требования, описываю процессы и готовлю постановки '
            + 'для разработки. Довожу задачу до приёмки.» — это заранее написанный образец стиля. '
            + 'Он не составлен по вашим данным и не подставляется в резюме автоматически.</p></div>'
          : '')
      + '</div>';
  }

  function builtPreview(b) {
    if (b.built === 'loading') {
      return pageHead('Сборка резюме') + UI.skeletonBlock();
    }
    var resume = builderToResume(b);
    return ''
      + pageHead('Резюме собрано', 'Поля подставлены в предпросмотр локально, в браузере.')
      + note('demo', '<div><strong>Демонстрационная сборка.</strong> Настоящий ИИ не подключён: текст не '
        + 'переписывался и не оценивался.</div>')
      + '<div class="card">' + previewCard(resume, true) + '</div>'
      + '<div class="card stack">'
      + '  <h2>Что дальше</h2>'
      + '  <div class="btn-row">'
      + '    <button type="button" class="btn" data-act="builder:edit">Редактировать</button>'
      + '    <button type="button" class="btn btn--primary" data-act="builder:save">Сохранить и использовать для подготовки</button>'
      + '    <button type="button" class="btn" data-act="stub:export">Экспорт в PDF</button>'
      + '  </div>'
      + '  <p class="faint" style="font-size:13px">Экспорт — заглушка: макет не создаёт файлы.</p>'
      + '</div>';
  }

  /* ---------------- Загрузка готового резюме ---------------- */

  function upload() {
    var state = Store.get();
    var up = state.upload;
    var fileRow = up.fileName
      ? '<div class="row-item" style="margin-top:16px"><div class="row-item__main">'
        + '<div class="row-item__title">' + esc(up.fileName) + '</div>'
        + '<div class="row-item__meta">Файл выбран локально. Он не загружается на сервер и не читается макетом.</div>'
        + '</div><div class="btn-row">'
        + '<button type="button" class="btn btn--sm" data-act="upload:pick">Заменить</button>'
        + '<button type="button" class="btn btn--sm btn--danger" data-act="upload:clear">Удалить</button>'
        + '</div></div>'
      : '';

    return ''
      + pageHead('Загрузка готового резюме', 'Выберите файл, чтобы посмотреть, как устроен разбор.')
      + note('alert', '<div><strong>Чтение PDF и DOCX ещё не реализовано.</strong> Файл остаётся на вашем '
        + 'устройстве: он не отправляется по сети и не анализируется. Отчёт ниже — общий демонстрационный образец, '
        + 'а не разбор вашего документа.</div>')
      + '<div class="card">'
      + '  <button type="button" class="dropzone" id="dropzone" data-act="upload:pick">'
      + '    <b>Перетащите файл сюда или нажмите, чтобы выбрать</b>'
      + '    <span class="muted">Для демонстрации подойдут PDF или DOCX</span>'
      + '  </button>'
      + '  <input type="file" id="file-input" class="visually-hidden" accept=".pdf,.docx,.doc,.rtf,.txt" '
      + '    aria-label="Выбрать файл резюме">'
      + fileRow
      + '  <div class="btn-row" style="margin-top:16px">'
      + '    <button type="button" class="btn btn--primary" data-act="upload:show-analysis">Показать пример анализа</button>'
      + '    <a class="btn" href="#/resumes">К списку резюме</a>'
      + '  </div>'
      + '</div>'
      + (up.analysisShown ? analysisReport() : '');
  }

  function suggestionBlock(item, decision) {
    var status = decision === 'accepted'
      ? '<span class="tag tag--ok">Принято</span>'
      : (decision === 'rejected' ? '<span class="tag">Отклонено</span>' : '');
    return ''
      + '<div class="q-item">'
      + '  <div class="q-item__top"><span class="tag tag--info">Предложение</span>' + status + '</div>'
      + '  <div class="q-item__text">' + esc(item.title) + '</div>'
      + '  <p class="muted" style="font-size:13.5px">' + esc(item.why) + '</p>'
      + '  <div class="diff-old"><b style="font-size:12px">Было</b><div>' + esc(item.before) + '</div></div>'
      + '  <div class="diff-new"><b style="font-size:12px">Стало</b><div>' + esc(item.after) + '</div></div>'
      + '  <div class="btn-row" style="margin-top:12px">'
      + '    <button type="button" class="btn btn--sm btn--primary" data-act="sug:accept" data-id="' + esc(item.id) + '">Принять</button>'
      + '    <button type="button" class="btn btn--sm" data-act="sug:reject" data-id="' + esc(item.id) + '">Отклонить</button>'
      + '  </div>'
      + '</div>';
  }

  function analysisReport() {
    var state = Store.get();
    var report = DEMO_DATA.analysisReport;
    var decisions = state.upload.decisions;
    var accepted = report.vague.concat(report.missing).filter(function (s) {
      return decisions[s.id] === 'accepted';
    });

    return ''
      + '<div class="card stack">'
      + '  <div class="card__head"><div class="card__title"><h2>Демонстрационный разбор резюме</h2>'
      + '  <small>Образец отчёта на подготовленном примере</small></div>' + UI.demoBadge('Образец') + '</div>'
      + note('demo', '<div>Это разбор демонстрационного резюме из комплекта макета. Ваш файл не читался. '
        + 'Ложные работодатели, навыки и достижения не добавляются.</div>')
      + '  <h3>Сильные стороны</h3>'
      + '  <ul>' + report.strengths.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>'
      + '  <h3>Неясные формулировки</h3>'
      + report.vague.map(function (s) { return suggestionBlock(s, decisions[s.id]); }).join('')
      + '  <h3>Недостающая информация</h3>'
      + report.missing.map(function (s) { return suggestionBlock(s, decisions[s.id]); }).join('')
      + '</div>'
      + '<div class="card stack">'
      + '  <div class="card__head"><div class="card__title"><h2>Демонстрационная версия резюме</h2>'
      + '  <small>Принятые предложения применяются к образцу</small></div></div>'
      + (accepted.length
          ? '<ul class="list">' + accepted.map(function (s) {
              return '<li><b>' + esc(s.title) + '</b><div class="diff-new">' + esc(s.after) + '</div></li>';
            }).join('') + '</ul>'
          : '<p class="muted">Ни одно предложение пока не принято. Нажмите «Принять», чтобы увидеть изменение в образце.</p>')
      + '  <div class="btn-row">'
      + '    <button type="button" class="btn btn--primary" data-act="upload:save">Сохранить как версию резюме</button>'
      + '    <a class="btn" href="#/vacancy/new">Перейти к вакансии</a>'
      + '  </div>'
      + '</div>';
  }

  /* ---------------- Список резюме и карточка ---------------- */

  function resumes() {
    var state = Store.get();
    if (state.scenario === 'loading') return pageHead('Мои резюме') + UI.skeletonBlock();
    if (state.scenario === 'error') return pageHead('Мои резюме') + UI.errorBlock();

    if (!state.resumes.length) {
      return pageHead('Мои резюме')
        + UI.emptyState('Резюме пока нет',
            'Соберите резюме в мастере или загрузите готовый файл, чтобы посмотреть демонстрационный разбор.',
            'Создать резюме', 'go:#/resume/new')
        + '<div class="btn-row" style="margin-top:16px;justify-content:center">'
        + '<button type="button" class="btn" data-act="go:#/resume/upload">Загрузить файл</button></div>';
    }

    var rows = state.resumes.map(function (r) {
      return ''
        + '<li><div class="row-item">'
        + '  <div class="row-item__main">'
        + '    <div class="row-item__title">' + esc(r.title) + ' '
        + (r.demo ? UI.demoBadge('Демо-данные') : '') + '</div>'
        + '    <div class="row-item__meta">Версия ' + r.rev + ' · изменено ' + esc(r.updatedAt)
        + ' · ' + (r.source === 'uploaded' ? 'из файла' : 'создано в мастере') + '</div>'
        + '  </div>'
        + '  <div class="btn-row">'
        + '    <button type="button" class="btn btn--sm" data-act="go:#/resume/' + esc(r.id) + '">Открыть</button>'
        + '    <button type="button" class="btn btn--sm" data-act="resume:rename" data-id="' + esc(r.id) + '">Переименовать</button>'
        + '    <button type="button" class="btn btn--sm btn--danger" data-act="resume:delete" data-id="' + esc(r.id) + '">Удалить</button>'
        + '  </div>'
        + '</div></li>';
    }).join('');

    return ''
      + pageHead('Мои резюме', 'Версии резюме, которые можно использовать в подготовке к вакансии.')
      + '<div class="btn-row" style="margin-bottom:16px">'
      + '  <a class="btn btn--primary" href="#/resume/new">Создать резюме</a>'
      + '  <a class="btn" href="#/resume/upload">Загрузить готовое</a>'
      + '</div>'
      + '<ul class="list">' + rows + '</ul>';
  }

  function resumeCard(id) {
    var resume = Store.resumeById(id);
    if (!resume) {
      return pageHead('Резюме не найдено')
        + UI.emptyState('Такой версии резюме нет', 'Возможно, она была удалена в этом сеансе макета.',
            'К списку резюме', 'go:#/resumes');
    }
    return ''
      + pageHead(resume.title, 'Версия ' + resume.rev + ' · изменено ' + resume.updatedAt)
      + (resume.fileNameShown ? note('info', '<div>' + esc(resume.fileNameShown) + '</div>') : '')
      + '<div class="card">' + previewCard(resume, false) + '</div>'
      + '<div class="card stack">'
      + '  <h2>Действия</h2>'
      + '  <div class="btn-row">'
      + '    <button type="button" class="btn" data-act="resume:tweak" data-id="' + esc(resume.id) + '">'
      + '      Внести демонстрационную правку</button>'
      + '    <button type="button" class="btn" data-act="resume:rename" data-id="' + esc(resume.id) + '">Переименовать</button>'
      + '    <button type="button" class="btn btn--primary" data-act="resume:use" data-id="' + esc(resume.id) + '">'
      + '      Использовать для подготовки</button>'
      + '    <button type="button" class="btn" data-act="stub:export">Экспорт в PDF</button>'
      + '  </div>'
      + '  <p class="faint" style="font-size:13px">«Внести правку» повышает версию резюме — так можно проверить, '
      + '  как подготовка помечается как устаревшая.</p>'
      + '</div>';
  }

  /* ---------------- Вакансии ---------------- */

  function vacancies() {
    var state = Store.get();
    if (state.scenario === 'loading') return pageHead('Вакансии и подготовка') + UI.skeletonBlock();
    if (state.scenario === 'error') return pageHead('Вакансии и подготовка') + UI.errorBlock();
    if (state.scenario === 'limit') return pageHead('Вакансии и подготовка') + UI.limitBlock();

    if (!state.preps.length) {
      return pageHead('Вакансии и подготовка')
        + UI.emptyState('Подготовок пока нет',
            'Добавьте вакансию и выберите резюме — макет свяжет их в одну подготовку.',
            'Добавить вакансию', 'go:#/vacancy/new');
    }

    var rows = state.preps.map(function (p) {
      var vacancy = Store.vacancyById(p.vacancyId);
      var resume = Store.resumeById(p.resumeId);
      return ''
        + '<li><div class="row-item">'
        + '  <div class="row-item__main">'
        + '    <div class="row-item__title">' + esc(vacancy ? vacancy.title : 'Вакансия удалена') + ' '
        + (p.stale ? '<span class="tag tag--alert">Исходники изменились</span>' : '') + '</div>'
        + '    <div class="row-item__meta">' + esc(vacancy ? vacancy.company : '—')
        + ' · резюме: ' + esc(resume ? resume.title : 'не выбрано') + '</div>'
        + '  </div>'
        + '  <div class="btn-row">'
        + '    <button type="button" class="btn btn--sm" data-act="go:#/prep/' + esc(p.id) + '/match">Сопоставление</button>'
        + '    <button type="button" class="btn btn--sm" data-act="go:#/prep/' + esc(p.id) + '/questions">Вопросы</button>'
        + '    <button type="button" class="btn btn--sm btn--danger" data-act="prep:delete" data-id="' + esc(p.id) + '">Удалить</button>'
        + '  </div>'
        + '</div></li>';
    }).join('');

    return ''
      + pageHead('Вакансии и подготовка', 'Каждая подготовка связывает вакансию, версию резюме, сопоставление и вопросы.')
      + '<div class="btn-row" style="margin-bottom:16px"><a class="btn btn--primary" href="#/vacancy/new">Добавить вакансию</a></div>'
      + '<ul class="list">' + rows + '</ul>';
  }

  function vacancyNew() {
    var state = Store.get();
    var draft = state.vacancyDraft;
    var resumeOptions = [{ value: '', label: 'Выберите резюме' }].concat(
      state.resumes.map(function (r) { return { value: r.id, label: r.title }; }));

    var ready = draft.title && draft.text && draft.resumeId;

    return ''
      + pageHead('Добавление вакансии', 'Вставьте текст вакансии и выберите резюме для сопоставления.')
      + '<div class="card stack">'
      + '  <h2>Импорт по ссылке</h2>'
      + UI.field({ id: 'vac-url', label: 'Ссылка на вакансию', model: 'vacancyDraft.url',
          value: draft.url || '', placeholder: 'https://hh.ru/vacancy/...' })
      + '  <div class="btn-row"><button type="button" class="btn" data-act="stub:import">Импортировать по ссылке</button></div>'
      + note('alert', '<div><strong>Получение вакансии по ссылке не реализовано.</strong> Макет не ходит в сеть. '
        + 'Вставьте текст вручную или откройте подготовленный пример.</div>')
      + '  <div class="btn-row"><button type="button" class="btn" data-act="vacancy:example">Открыть пример вакансии</button></div>'
      + '</div>'
      + '<div class="card stack">'
      + '  <h2>Текст вакансии</h2>'
      + '  <div class="grid-2">'
      + UI.field({ id: 'vac-title', label: 'Должность', model: 'vacancyDraft.title', value: draft.title, required: true })
      + UI.field({ id: 'vac-company', label: 'Компания', model: 'vacancyDraft.company', value: draft.company })
      + '  </div>'
      + UI.field({ id: 'vac-text', label: 'Описание и требования', model: 'vacancyDraft.text', type: 'textarea',
          value: draft.text, required: true, rows: 8,
          hint: 'Текст остаётся в браузере. Демонстрационное сопоставление построено на подготовленном примере.' })
      + UI.select({ id: 'vac-resume', label: 'Резюме для сопоставления', model: 'vacancyDraft.resumeId',
          value: draft.resumeId, options: resumeOptions, act: 'rerender' })
      + '</div>'
      + '<div class="card stack">'
      + '  <h2>Предпросмотр подготовки</h2>'
      + (ready
          ? '<ul class="list">'
            + '<li><b>Вакансия:</b> ' + esc(draft.title) + (draft.company ? ' — ' + esc(draft.company) : '') + '</li>'
            + '<li><b>Резюме:</b> ' + esc((Store.resumeById(draft.resumeId) || {}).title || '') + '</li>'
            + '<li><b>Источник требований:</b> вставленный текст (в демо используется подготовленный разбор)</li>'
            + '</ul>'
          : note('info', '<div>Чтобы собрать подготовку, укажите должность, вставьте текст вакансии и выберите резюме.</div>'))
      + '  <div class="btn-row">'
      + '    <button type="button" class="btn btn--primary" data-act="vacancy:create"'
      + (ready ? '' : ' aria-disabled="true" disabled') + '>Создать подготовку</button>'
      + '    <a class="btn" href="#/vacancies">Отмена</a>'
      + '  </div>'
      + '</div>';
  }

  return {
    pageHead: pageHead,
    prepTitle: prepTitle,
    staleBanner: staleBanner,
    nextStep: nextStep,
    previewCard: previewCard,
    splitLines: splitLines,
    start: start,
    auth: auth,
    onboarding: onboarding,
    overview: overview,
    resumeWizard: resumeWizard,
    upload: upload,
    resumes: resumes,
    resumeCard: resumeCard,
    vacancies: vacancies,
    vacancyNew: vacancyNew
  };
})();

</script>
<script>
/* ==== screens-prep.js ==== */
/* ============================================================
   Экраны: сопоставление, вопросы, тренировочные интервью,
   помощник на собеседовании, тарифы, история, настройки, данные.
   ============================================================ */

var ScreensPrep = (function () {
  'use strict';

  var esc = UI.esc;
  var escLines = UI.escLines;
  var note = UI.note;
  var pageHead = ScreensCore.pageHead;
  var staleBanner = ScreensCore.staleBanner;

  var STATUS_LABEL = {
    confirmed: { text: 'Подтверждено', cls: 'tag--ok' },
    unclear: { text: 'Нужно уточнить', cls: 'tag--info' },
    missing: { text: 'Не указано в резюме', cls: 'tag--alert' }
  };

  function needPrep(prep, action) {
    return pageHead(action)
      + UI.emptyState('Подготовка не выбрана',
          'Сначала добавьте вакансию и выберите резюме — макет свяжет их в одну подготовку.',
          'Добавить вакансию', 'go:#/vacancy/new');
  }

  function sourcesBar(prep) {
    var resume = Store.resumeById(prep.resumeId);
    var vacancy = Store.vacancyById(prep.vacancyId);
    return ''
      + '<div class="toolbar">'
      + '  <span><b>Вакансия:</b> ' + esc(vacancy ? vacancy.title + ' · ' + vacancy.company : 'не выбрана') + '</span>'
      + '  <span><b>Резюме:</b> ' + esc(resume ? resume.title : 'не выбрано') + '</span>'
      + '</div>';
  }

  /* ---------------- Сопоставление ---------------- */

  function match(prepId) {
    var state = Store.get();
    var prep = Store.prepById(prepId) || Store.activePrep();
    if (!prep) return needPrep(prep, 'Сопоставление резюме с вакансией');
    if (state.scenario === 'loading') return pageHead('Сопоставление') + UI.skeletonBlock();
    if (state.scenario === 'error') return pageHead('Сопоставление') + UI.errorBlock();

    var vacancy = Store.vacancyById(prep.vacancyId);
    var requirements = (vacancy && vacancy.requirements) || DEMO_DATA.vacancy.requirements;

    var counts = { confirmed: 0, unclear: 0, missing: 0 };
    requirements.forEach(function (r) { counts[r.status] += 1; });

    var open = state.openRequirement || '';
    var items = requirements.map(function (r) {
      var label = STATUS_LABEL[r.status];
      var expanded = open === r.id;
      return ''
        + '<div class="req-item">'
        + '  <button type="button" class="req-item__head" data-act="req:toggle" data-id="' + esc(r.id) + '"'
        + '    aria-expanded="' + (expanded ? 'true' : 'false') + '">'
        + '    <span class="tag ' + label.cls + '">' + esc(label.text) + '</span>'
        + '    <span class="req-item__text">' + esc(r.text) + '</span>'
        + '    <span class="req-item__chev" aria-hidden="true">' + (expanded ? '▲' : '▼') + '</span>'
        + '  </button>'
        + (expanded
            ? '<div class="req-item__body stack-sm">'
              + '<p><b>Что нашли в резюме:</b> ' + esc(r.evidence) + '</p>'
              + '<p><b>Как подготовиться:</b> ' + esc(r.advice) + '</p>'
              + '</div>'
            : '')
        + '</div>';
    }).join('');

    return ''
      + pageHead('Сопоставление резюме с вакансией',
          'Требования вакансии и то, что подтверждается демонстрационным резюме.')
      + sourcesBar(prep)
      + staleBanner(prep)
      + note('demo', '<div><strong>Это образец отчёта.</strong> Разбор построен на подготовленном комплекте данных '
        + 'и не является анализом введённого вами текста.</div>')
      + '<div class="card stack">'
      + '  <div class="summary-counts">'
      + '    <div class="count-box"><b>' + counts.confirmed + '</b><span>подтверждено резюме</span></div>'
      + '    <div class="count-box"><b>' + counts.unclear + '</b><span>нужно уточнить</span></div>'
      + '    <div class="count-box"><b>' + counts.missing + '</b><span>не указано в резюме</span></div>'
      + '  </div>'
      + '  <p class="faint" style="font-size:13px">Общий процент соответствия не показывается: он не отражает '
      + '  вероятность приглашения и мешает разобрать конкретные пункты.</p>'
      + '</div>'
      + '<div class="card"><div class="card__head"><div class="card__title"><h2>Требования вакансии</h2>'
      + '<small>Нажмите на требование, чтобы раскрыть объяснение</small></div></div>' + items + '</div>'
      + '<div class="card"><div class="btn-row">'
      + '  <a class="btn" href="#/resumes">Улучшить резюме</a>'
      + '  <button type="button" class="btn btn--primary" data-act="go:#/prep/' + esc(prep.id) + '/questions">Перейти к вопросам</button>'
      + '  <button type="button" class="btn" data-act="prep:change-sources" data-id="' + esc(prep.id) + '">Изменить исходники</button>'
      + '</div></div>';
  }

  /* ---------------- Вопросы ---------------- */

  function questions(prepId) {
    var state = Store.get();
    var prep = Store.prepById(prepId) || Store.activePrep();
    if (!prep) return needPrep(prep, 'Вопросы для подготовки');
    if (state.scenario === 'loading') return pageHead('Вопросы для подготовки') + UI.skeletonBlock();
    if (state.scenario === 'error') return pageHead('Вопросы для подготовки') + UI.errorBlock();

    var filterTopic = state.qFilterTopic || 'all';
    var filterReady = state.qFilterReady || 'all';
    var openHints = state.qOpenHints || {};

    var topics = ['all'];
    DEMO_DATA.questions.forEach(function (q) {
      if (topics.indexOf(q.topic) < 0) topics.push(q.topic);
    });

    var visible = DEMO_DATA.questions.filter(function (q) {
      if (filterTopic !== 'all' && q.topic !== filterTopic) return false;
      if (filterReady === 'ready' && !prep.ready[q.id]) return false;
      if (filterReady === 'todo' && prep.ready[q.id]) return false;
      return true;
    });

    var readyCount = DEMO_DATA.questions.filter(function (q) { return prep.ready[q.id]; }).length;

    var items = visible.map(function (q) {
      var isReady = !!prep.ready[q.id];
      var hintOpen = !!openHints[q.id];
      return ''
        + '<div class="q-item">'
        + '  <div class="q-item__top">'
        + '    <span class="tag">' + esc(q.topic) + '</span>'
        + (isReady ? '<span class="tag tag--ok">Подготовлено</span>' : '')
        + '  </div>'
        + '  <div class="q-item__text">' + esc(q.text) + '</div>'
        + '  <p class="muted" style="font-size:13.5px"><b>Почему релевантно:</b> ' + esc(q.why) + '</p>'
        + UI.field({ id: 'ans-' + q.id, label: 'Ваш ответ', type: 'textarea',
            model: 'preps.' + prepIndex(prep) + '.answers.' + q.id,
            value: prep.answers[q.id] || '',
            hint: 'Сохраняется только в памяти страницы на время сеанса макета.' })
        + '  <div class="btn-row">'
        + '    <button type="button" class="btn btn--sm" data-act="q:hint" data-id="' + esc(q.id) + '" '
        + '      aria-expanded="' + (hintOpen ? 'true' : 'false') + '">'
        + (hintOpen ? 'Скрыть ориентиры' : 'Показать ориентиры') + '</button>'
        + '    <button type="button" class="btn btn--sm' + (isReady ? '' : ' btn--primary') + '" '
        + '      data-act="q:ready" data-id="' + esc(q.id) + '">'
        + (isReady ? 'Снять отметку' : 'Отметить «Подготовлено»') + '</button>'
        + '  </div>'
        + (hintOpen
            ? '<div class="note note--info" style="margin-top:12px"><div><b>Ориентиры:</b> ' + esc(q.guidance) + '</div></div>'
            : '')
        + '</div>';
    }).join('');

    return ''
      + pageHead('Вероятные вопросы для подготовки',
          'Список подготовлен для демонстрации. Никаких обещаний, что спросят именно это.')
      + sourcesBar(prep)
      + staleBanner(prep)
      + '<div class="toolbar">'
      + '  <label for="q-topic">Тема</label>'
      + '  <select id="q-topic" data-change-act="q:filter-topic">'
      + topics.map(function (t) {
          return '<option value="' + esc(t) + '"' + (t === filterTopic ? ' selected' : '') + '>'
            + (t === 'all' ? 'Все темы' : esc(t)) + '</option>';
        }).join('')
      + '  </select>'
      + '  <label for="q-ready">Готовность</label>'
      + '  <select id="q-ready" data-change-act="q:filter-ready">'
      + '    <option value="all"' + (filterReady === 'all' ? ' selected' : '') + '>Все</option>'
      + '    <option value="ready"' + (filterReady === 'ready' ? ' selected' : '') + '>Подготовленные</option>'
      + '    <option value="todo"' + (filterReady === 'todo' ? ' selected' : '') + '>Осталось разобрать</option>'
      + '  </select>'
      + '  <span class="muted">Подготовлено ' + readyCount + ' из ' + DEMO_DATA.questions.length + '</span>'
      + '</div>'
      + (items || UI.emptyState('Под фильтр ничего не попало', 'Измените тему или готовность.', 'Сбросить фильтры', 'q:filter-reset'))
      + '<div class="card"><div class="btn-row">'
      + '  <button type="button" class="btn btn--primary" data-act="go:#/prep/' + esc(prep.id) + '/interview">'
      + '    Начать пробное интервью</button>'
      + '  <button type="button" class="btn" data-act="go:#/prep/' + esc(prep.id) + '/match">Вернуться к сопоставлению</button>'
      + '</div></div>';
  }

  function prepIndex(prep) {
    var list = Store.get().preps;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === prep.id) return i;
    }
    return 0;
  }

  /* ---------------- Список тренировок ---------------- */

  function interviews() {
    var state = Store.get();
    if (!Store.sectionAllowed('interviews')) return locked('Тренировочные интервью', 'training');
    if (!state.preps.length) return needPrep(null, 'Тренировочные интервью');

    var prep = Store.activePrep() || state.preps[0];
    var options = state.preps.map(function (p) {
      return { value: p.id, label: ScreensCore.prepTitle(p) };
    });

    return ''
      + pageHead('Тренировочные интервью', 'Выберите подготовку и формат тренировки.')
      + '<div class="card stack">'
      + UI.select({ id: 'training-prep', label: 'Подготовка', value: prep.id, options: options, act: 'prep:select' })
      + note('demo', '<div>Реплики интервьюера берутся из фиксированного сценария. Ответы не оцениваются ИИ.</div>')
      + '</div>'
      + '<div class="grid-2">'
      + '  <div class="card stack">'
      + '    <h2>Текстовое интервью</h2>'
      + '    <p class="muted">Чат: вопрос, ваш ответ, следующий вопрос и демонстрационный итог.</p>'
      + '    <div class="btn-row"><button type="button" class="btn btn--primary" data-act="go:#/prep/'
      + esc(prep.id) + '/interview">Открыть чат</button></div>'
      + '  </div>'
      + '  <div class="card stack">'
      + '    <h2>Голосовое интервью</h2>'
      + '    <p class="muted">Симуляция разговора: статусы, расшифровка и завершение. Микрофон не запрашивается.</p>'
      + '    <div class="btn-row"><button type="button" class="btn" data-act="go:#/prep/'
      + esc(prep.id) + '/voice">Открыть голосовой экран</button></div>'
      + '  </div>'
      + '</div>'
      + '<div class="card stack"><h2>Прошлые тренировки</h2>'
      + (state.history.filter(function (h) { return /интервью/i.test(h.what); }).length
          ? '<ul class="list">' + state.history.filter(function (h) { return /интервью/i.test(h.what); })
              .map(function (h) {
                return '<li><div class="row-item"><div class="row-item__main">'
                  + '<div class="row-item__title">' + esc(h.what) + '</div>'
                  + '<div class="row-item__meta">' + esc(h.when) + '</div></div>'
                  + '<button type="button" class="btn btn--sm" data-act="go:' + esc(h.route) + '">Открыть</button>'
                  + '</div></li>';
              }).join('') + '</ul>'
          : '<p class="muted">Тренировок пока не было.</p>')
      + '</div>';
  }

  /* ---------------- Текстовое интервью ---------------- */

  function ensureChat(prep) {
    if (!prep.chat) {
      prep.chat = { started: false, index: 0, messages: [], pending: false, finished: false, failed: false, draft: '' };
    }
    return prep.chat;
  }

  function interview(prepId) {
    var state = Store.get();
    if (!Store.sectionAllowed('interviews')) return locked('Текстовое пробное интервью', 'training');
    var prep = Store.prepById(prepId) || Store.activePrep();
    if (!prep) return needPrep(prep, 'Текстовое пробное интервью');
    var chat = ensureChat(prep);

    if (!chat.started) {
      return ''
        + pageHead('Текстовое пробное интервью', 'Настройка формата перед началом.')
        + ScreensCore.staleBanner(prep)
        + '<div class="card stack">'
        + sourcesBar(prep)
        + '  <h2>Формат</h2>'
        + '  <p class="muted">Пять вопросов из подготовленного сценария: опыт, процессы, SQL, постановки и кейс.</p>'
        + note('demo', '<div><strong>Реплики интервьюера — фиксированный сценарий.</strong> Ваши ответы видны в '
          + 'переписке, но не анализируются: настоящей оценки ответа нет.</div>')
        + '  <div class="btn-row"><button type="button" class="btn btn--primary" data-act="chat:start">Начать интервью</button>'
        + '  <button type="button" class="btn" data-act="go:#/prep/' + esc(prep.id) + '/questions">Сначала разобрать вопросы</button></div>'
        + '</div>';
    }

    if (chat.finished) return interviewSummary(prep);

    var messages = chat.messages.map(function (m) {
      var cls = m.who === 'user' ? 'msg msg--user' : (m.who === 'system' ? 'msg msg--sys' : 'msg');
      var who = m.who === 'user' ? 'Вы' : (m.who === 'system' ? 'Макет' : 'Интервьюер (демо-сценарий)');
      return '<div class="' + cls + '"><span class="msg__who">' + esc(who) + '</span>'
        + '<div class="msg__body">' + escLines(m.text) + '</div></div>';
    }).join('');

    var pending = chat.pending
      ? '<div class="msg"><span class="msg__who">Интервьюер (демо-сценарий)</span>'
        + '<div class="msg__body"><span class="dots" aria-label="Готовится следующая реплика">'
        + '<span></span><span></span><span></span></span></div></div>'
      : '';

    var failedBlock = chat.failed
      ? note('alert', '<div><strong>Демонстрационная ошибка отправки.</strong> Так выглядит состояние, когда реплика '
          + 'не прошла. <button type="button" class="btn btn--sm" style="margin-top:8px" data-act="chat:retry">Повторить</button></div>')
      : '';

    return ''
      + pageHead('Текстовое пробное интервью', 'Вопрос ' + Math.min(chat.index + 1, DEMO_DATA.interviewScript.length)
          + ' из ' + DEMO_DATA.interviewScript.length)
      + sourcesBar(prep)
      + '<div class="card stack">'
      + '  <div class="chat" id="chat-log" role="log" aria-live="polite">' + messages + pending + '</div>'
      + failedBlock
      + UI.field({ id: 'chat-input', label: 'Ваш ответ', type: 'textarea', model: 'chatDraft',
          value: chat.draft, placeholder: 'Напишите ответ так, как сказали бы вслух',
          hint: 'Текст остаётся в браузере и сбрасывается после перезагрузки.' })
      + '  <div class="btn-row btn-row--between">'
      + '    <div class="btn-row">'
      + '      <button type="button" class="btn btn--danger" data-act="chat:exit">Завершить и выйти</button>'
      + '      <button type="button" class="btn btn--quiet btn--sm" data-act="chat:fail">Показать ошибку отправки (демо)</button>'
      + '    </div>'
      + '    <button type="button" class="btn btn--primary" data-act="chat:send"' + (chat.pending ? ' disabled' : '') + '>'
      + '      Отправить ответ</button>'
      + '  </div>'
      + '</div>';
  }

  function interviewSummary(prep) {
    var s = DEMO_DATA.interviewSummary;
    var answers = prep.chat.messages.filter(function (m) { return m.who === 'user'; });
    return ''
      + pageHead('Итог пробного интервью', 'Демонстрационный отчёт по завершённой тренировке.')
      + note('demo', '<div><strong>Отчёт заранее подготовлен.</strong> Он не составлен по вашим ответам: настоящей '
        + 'оценки в макете нет. Ваши ' + answers.length + ' ответ(ов) остались только в переписке этого сеанса.</div>')
      + '<div class="card stack">'
      + '  <h2>Примеры сильных ответов</h2>'
      + '  <ul>' + s.strong.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
      + '  <h2>Темы для повторения</h2>'
      + '  <ul>' + s.repeat.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
      + '  <h2>Рекомендации</h2>'
      + '  <ul>' + s.advice.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
      + '</div>'
      + '<div class="card"><div class="btn-row">'
      + '  <button type="button" class="btn btn--primary" data-act="chat:restart">Повторить тренировку</button>'
      + '  <button type="button" class="btn" data-act="go:#/prep/' + esc(prep.id) + '/voice">Попробовать голосом</button>'
      + '  <button type="button" class="btn" data-act="go:#/prep/' + esc(prep.id) + '/questions">Вернуться к вопросам</button>'
      + '</div></div>';
  }

  /* ---------------- Голосовое интервью ---------------- */

  function ensureVoice(prep) {
    if (!prep.voice) {
      prep.voice = { status: 'idle', line: 0, finished: false };
    }
    return prep.voice;
  }

  var VOICE_STATUS = {
    idle: { label: 'Не начато', hint: 'Нажмите «Начать разговор», чтобы запустить демонстрационный сценарий.' },
    listening: { label: 'Слушаю', hint: 'Так выглядел бы экран, пока говорит кандидат. Микрофон не используется.' },
    thinking: { label: 'Готовлю ответ', hint: 'Пауза перед следующей репликой сценария.' },
    speaking: { label: 'Отвечаю', hint: 'Реплика интервьюера из фиксированного сценария. Синтез речи не включён.' },
    paused: { label: 'Пауза', hint: 'Разговор приостановлен.' },
    lost: { label: 'Связь потеряна', hint: 'Демонстрация состояния обрыва связи.' }
  };

  function voice(prepId) {
    var state = Store.get();
    if (!Store.sectionAllowed('interviews')) return locked('Голосовое пробное интервью', 'training');
    var prep = Store.prepById(prepId) || Store.activePrep();
    if (!prep) return needPrep(prep, 'Голосовое пробное интервью');
    var v = ensureVoice(prep);

    if (v.finished) {
      return ''
        + pageHead('Итог голосовой тренировки', 'Демонстрационный итог.')
        + note('demo', '<div>Звук не записывался, расшифровка взята из сценария макета.</div>')
        + '<div class="card stack">'
        + '  <h2>Что было в сценарии</h2>'
        + '  <ul>' + DEMO_DATA.voiceScript.map(function (l) {
              return '<li><b>' + esc(l.who) + ':</b> ' + esc(l.text) + '</li>';
            }).join('') + '</ul>'
        + '  <h2>На что обратить внимание</h2>'
        + '  <ul>' + DEMO_DATA.interviewSummary.advice.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
        + '</div>'
        + '<div class="card"><div class="btn-row">'
        + '  <button type="button" class="btn btn--primary" data-act="voice:restart">Пройти заново</button>'
        + '  <button type="button" class="btn" data-act="prep:open" data-id="' + esc(prep.id) + '">Вернуться в подготовку</button>'
        + '</div></div>';
    }

    var status = VOICE_STATUS[v.status];
    var lines = DEMO_DATA.voiceScript.slice(0, v.line).map(function (l) {
      return '<div class="transcript__line"><b>' + esc(l.who) + '</b>' + esc(l.text) + '</div>';
    }).join('');

    var orbCls = 'voice-orb'
      + (v.status === 'listening' || v.status === 'speaking' ? ' voice-orb--live' : '')
      + (v.status === 'lost' ? ' voice-orb--err' : '');

    return ''
      + pageHead('Голосовое пробное интервью', 'Симуляция разговора без обращения к микрофону.')
      + sourcesBar(prep)
      + note('alert', '<div><strong>Только симуляция.</strong> Разрешение на микрофон не запрашивается, звук не '
        + 'записывается, синтез речи не используется. Индикаторы и расшифровка — из фиксированного сценария.</div>')
      + '<div class="card stack">'
      + '  <div class="voice-stage">'
      + '    <div class="' + orbCls + '">' + esc(status.label) + '</div>'
      + '    <p class="muted" role="status" aria-live="polite">' + esc(status.hint) + '</p>'
      + '  </div>'
      + '  <div class="btn-row">'
      + (v.status === 'idle'
          ? '<button type="button" class="btn btn--primary" data-act="voice:start">Начать разговор</button>'
          : '<button type="button" class="btn btn--primary" data-act="voice:next">Следующая реплика</button>')
      + '    <button type="button" class="btn" data-act="voice:pause"' + (v.status === 'idle' ? ' disabled' : '') + '>'
      + (v.status === 'paused' ? 'Продолжить' : 'Пауза') + '</button>'
      + '    <button type="button" class="btn" data-act="voice:mic">Микрофон (заглушка)</button>'
      + '    <button type="button" class="btn btn--danger" data-act="voice:finish"' + (v.status === 'idle' ? ' disabled' : '') + '>'
      + '      Завершить</button>'
      + '  </div>'
      + '  <div class="toolbar">'
      + '    <label for="voice-scenario">Демо-сценарий состояния</label>'
      + '    <select id="voice-scenario" data-change-act="voice:set-status">'
      + Object.keys(VOICE_STATUS).map(function (key) {
          return '<option value="' + key + '"' + (key === v.status ? ' selected' : '') + '>'
            + esc(VOICE_STATUS[key].label) + '</option>';
        }).join('')
      + '    </select>'
      + '  </div>'
      + '  <h2>Расшифровка</h2>'
      + '  <div class="transcript">' + (lines || '<p class="muted">Расшифровка появится после начала разговора.</p>') + '</div>'
      + '</div>';
  }

  /* ---------------- Помощник на собеседовании ---------------- */

  function assistant() {
    var state = Store.get();
    if (!Store.sectionAllowed('assistant')) return locked('Помощник на собеседовании', 'assistant');

    var a = state.assistant;
    var prepOptions = state.preps.length
      ? state.preps.map(function (p) { return { value: p.id, label: ScreensCore.prepTitle(p) }; })
      : [{ value: '', label: 'Подготовок пока нет' }];

    var statusText = {
      disconnected: 'Не подключён',
      connecting: 'Подключение',
      connected: 'Подключён',
      failed: 'Ошибка подключения',
      ended: 'Сессия завершена'
    }[a.status];

    var statusTag = {
      disconnected: 'tag',
      connecting: 'tag tag--info',
      connected: 'tag tag--ok',
      failed: 'tag tag--alert',
      ended: 'tag'
    }[a.status];

    var hint = DEMO_DATA.assistantHints[a.hintIndex];

    return ''
      + pageHead('Помощник на собеседовании',
          'Отдельный компонент, который по замыслу работает во время реального интервью.')

        + 'ничего не скачивается, звук и экран не захватываются, подсказки не генерируются.</div>')
      + '<div class="card stack">'
      + '  <h2>Зачем нужен отдельный компонент</h2>'
      + '  <p class="muted">Собеседование обычно идёт в стороннем приложении для видеозвонков. Веб-страница не имеет '
      + '  доступа к чужому окну, поэтому по замыслу владельца потребуется отдельный компонент на компьютере '

      + '</div>'
      + '<div class="card stack">'
      + '  <h2>Подготовка для сессии</h2>'
      + UI.select({ id: 'assistant-prep', label: 'Резюме и вакансия', value: a.prepId || '',
          options: prepOptions, act: 'assistant:prep' })
      + (state.preps.length ? '' : note('info', '<div>Сначала добавьте вакансию и резюме в разделе «Вакансии и подготовка».</div>'))
      + '</div>'
      + '<div class="card stack">'
      + '  <h2>Порядок работы</h2>'
      + '  <ol>'
      + '    <li>Скачать компонент на компьютер.</li>'
      + '    <li>Подключить его к аккаунту.</li>'
      + '    <li>Выбрать подготовку — резюме и вакансию.</li>'
      + '    <li>Начать сессию, согласованную со всеми участниками разговора.</li>'
      + '  </ol>'
      + '  <p class="faint" style="font-size:13px">Это схема будущего опыта, а не инструкция по установке.</p>'
      + '  <div class="btn-row">'
      + '    <button type="button" class="btn btn--primary" data-act="assistant:download">Скачать помощник</button>'
      + '    <button type="button" class="btn" data-act="assistant:connect">Подключить (демо-статусы)</button>'
      + '    <button type="button" class="btn" data-act="assistant:hints">Посмотреть пример подсказок</button>'
      + '  </div>'
      + '</div>'
      + '<div class="card stack">'
      + '  <div class="card__head" style="margin-bottom:0"><div class="card__title"><h2>Состояние подключения</h2>'
      + '  <small>Демонстрационные статусы, реального соединения нет</small></div>'
      + '  <span class="' + statusTag + '">' + esc(statusText) + '</span></div>'
      + '  <div class="btn-row">'
      + ['disconnected', 'connecting', 'connected', 'failed', 'ended'].map(function (key) {
          return '<button type="button" class="btn btn--sm" data-act="assistant:status" data-status="' + key + '">'
            + esc({ disconnected: 'Не подключён', connecting: 'Подключение', connected: 'Подключён',
                    failed: 'Ошибка подключения', ended: 'Сессия завершена' }[key]) + '</button>';
        }).join('')
      + '  </div>'
      + '</div>'
      + (a.hintsOpen
          ? '<div class="card stack">'
            + '  <div class="card__head" style="margin-bottom:0"><div class="card__title">'
            + '    <h2>Пример подсказок</h2><small>Заранее подготовленные реплики, не результат распознавания</small></div>'
            + '    <div class="btn-row">'
            + '      <button type="button" class="btn btn--sm" data-act="assistant:hints-toggle">Свернуть</button>'
            + '      <button type="button" class="btn btn--sm" data-act="assistant:hints-close" aria-label="Закрыть панель подсказок">Закрыть</button>'
            + '    </div>'
            + '  </div>'
            + note('demo', '<div>Ни звук, ни экран не считываются. Ниже — фиксированный пример того, как могла бы '
              + 'выглядеть подсказка.</div>')
            + '  <div class="msg msg--sys" style="max-width:100%"><div class="msg__body">' + esc(hint.heard) + '</div></div>'
            + '  <div class="card" style="background:var(--surface-2)">'
            + '    <p><b>Направление ответа:</b> ' + esc(hint.hint) + '</p>'

            + DEMO_DATA.assistantHints.length + '</span>'
            + '  </div>'
            + '</div>'
          : '')
      + '<div class="card stack">'
      + '  <h2>Правила и согласие участников</h2>'
      + note('alert', '<div>Многие работодатели запрещают посторонние подсказки на собеседовании, а запись разговора '
        + 'без согласия участников может нарушать закон и правила площадки. Использование такого помощника — '
        + 'ответственность пользователя. Макет не обещает, что окно помощника невидимо при демонстрации экрана '
        + 'или незаметно для собеседника: это нерешённый технический и правовой вопрос.</div>')
      + '</div>';
  }

  /* ---------------- Тарифы ---------------- */

  function locked(title, requiredPlan) {
    var plan = Store.planById(requiredPlan);
    return ''
      + pageHead(title)
      + '<div class="card stack">'
      + note('demo', '<div><strong>Раздел недоступен на текущем демо-уровне.</strong> По задумке он входит в уровень '
        + '«' + esc(plan.name) + '». Здесь показано, как выглядит объяснение заблокированного действия.</div>')
      + '  <p class="muted">Функцию можно изучить в макете, переключив демо-уровень. Покупка недоступна: '
      + '  тарифы, цены и лимиты ещё не утверждены, а платежи не подключены.</p>'
      + '  <div class="btn-row">'
      + '    <button type="button" class="btn btn--primary" data-act="plan:set" data-plan="' + esc(requiredPlan) + '">'
      + '      Переключить демо-уровень на «' + esc(plan.name) + '»</button>'
      + '    <a class="btn" href="#/plans">Открыть тарифы</a>'
      + '  </div>'
      + '</div>';
  }

  function plans() {
    var state = Store.get();
    var cards = DEMO_DATA.plans.map(function (p) {
      var active = state.plan === p.id;
      return ''
        + '<div class="plan' + (active ? ' plan--active' : '') + '">'
        + '  <h3>' + esc(p.name) + '</h3>'
        + '  <div class="plan__price">' + esc(p.price) + '</div>'
        + '  <p class="muted" style="font-size:13px">' + esc(p.limits) + '</p>'
        + '  <ul>' + p.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>'
        + '  <div class="btn-row" style="margin-top:16px">'
        + (active
            ? '<span class="tag tag--ok">Текущий демо-уровень</span>'
            : '<button type="button" class="btn" data-act="plan:set" data-plan="' + esc(p.id) + '">Выбрать в демо</button>')
        + '    <button type="button" class="btn btn--sm" data-act="stub:pay">Оплатить</button>'
        + '  </div>'
        + '</div>';
    }).join('');

    var current = Store.planById(state.plan);

    return ''
      + pageHead('Тарифы и лимиты', 'Временные названия и группировка. Тарифная сетка не утверждена.')
      + note('demo', '<div><strong>Цены и лимиты не определены.</strong> Названия уровней рабочие. Оплата — заглушка: '
        + 'банковских полей и платёжных сервисов в макете нет.</div>')
      + '<div class="plans">' + cards + '</div>'
      + '<div class="card stack">'
      + '  <h2>Что доступно на уровне «' + esc(current.name) + '»</h2>'
      + '  <ul>'
      + '    <li>Мои резюме — доступно</li>'
      + '    <li>Вакансии и подготовка — доступно</li>'
      + '    <li>Тренировочные интервью — ' + (Store.sectionAllowed('interviews') ? 'доступно' : 'недоступно на этом уровне') + '</li>'
      + '    <li>Помощник на собеседовании — ' + (Store.sectionAllowed('assistant') ? 'доступно' : 'недоступно на этом уровне') + '</li>'
      + '  </ul>'
      + '  <div class="btn-row">'
      + '    <button type="button" class="btn" data-act="demo:scenario-limit">Показать состояние «лимит исчерпан»</button>'
      + '  </div>'
      + '</div>';
  }

  /* ---------------- История ---------------- */

  function history() {
    var state = Store.get();
    if (!state.history.length) {
      return pageHead('История')
        + UI.emptyState('История пуста', 'Здесь появятся подготовки и тренировки этого сеанса макета.',
            'К обзору', 'go:#/overview');
    }
    var rows = state.history.map(function (h) {
      return ''
        + '<li><div class="row-item">'
        + '  <div class="row-item__main">'
        + '    <div class="row-item__title">' + esc(h.what) + '</div>'
        + '    <div class="row-item__meta">' + esc(h.when) + '</div>'
        + '  </div>'
        + '  <button type="button" class="btn btn--sm" data-act="go:' + esc(h.route) + '">Открыть результат</button>'
        + '</div></li>';
    }).join('');
    return ''
      + pageHead('История', 'Подготовки и тренировки этого сеанса.')
      + note('info', '<div>История хранится в памяти страницы и очищается после перезагрузки.</div>')
      + '<ul class="list">' + rows + '</ul>';
  }

  /* ---------------- Настройки и данные ---------------- */

  function settings() {
    var state = Store.get();
    var s = state.settings;
    function toggle(key, title, text) {
      return ''
        + '<label class="switch">'
        + '  <input type="checkbox" data-toggle="' + key + '"' + (s[key] ? ' checked' : '') + '>'
        + '  <span class="switch__text">' + esc(title) + '<small>' + esc(text) + '</small></span>'
        + '</label>';
    }
    return ''
      + pageHead('Настройки и данные', 'Переключатели работают локально: настоящих уведомлений макет не отправляет.')
      + '<div class="card stack">'
      + '  <h2>Профиль</h2>'
      + UI.field({ id: 'set-name', label: 'Имя', model: '', value: DEMO_DATA.candidate.name,
          hint: 'Демонстрационное значение. Вымышленный профиль из комплекта макета.' })
      + UI.field({ id: 'set-city', label: 'Город', model: '', value: DEMO_DATA.candidate.city })
      + '  <div class="btn-row"><button type="button" class="btn" data-act="stub:profile-save">Сохранить профиль</button></div>'
      + '</div>'
      + '<div class="card stack">'
      + '  <h2>Уведомления</h2>'
      + note('info', '<div>Ни письма, ни push-уведомления не отправляются: почтовый сервис не подключён.</div>')
      + toggle('emailUpdates', 'Письма о новых возможностях', 'Заглушка переключателя')
      + toggle('weeklyDigest', 'Еженедельная сводка по подготовке', 'Заглушка переключателя')
      + toggle('practiceReminders', 'Напоминания о тренировках', 'Заглушка переключателя')
      + '</div>'
      + '<div class="card stack">'
      + '  <h2>Оформление</h2>'
      + '  <div class="btn-row">'
      + '    <button type="button" class="btn" data-act="theme:toggle">'
      + (state.theme === 'dark' ? 'Светлая тема' : 'Тёмная тема') + '</button>'
      + '  </div>'
      + '  <p class="faint" style="font-size:13px">Тема и выбранный демо-сценарий — единственное, что макет '
      + '  сохраняет в localStorage.</p>'
      + '</div>'
      + '<div class="card stack">'
      + '  <h2>Мои данные</h2>'
      + '  <p class="muted">Что предполагалось бы хранить в готовом продукте:</p>'
      + '  <ul>'
      + '    <li>Версии резюме и их содержимое.</li>'
      + '    <li>Добавленные вакансии и связанные подготовки.</li>'
      + '    <li>Ответы на вопросы и переписку тренировочных интервью.</li>'
      + '    <li>Настройки аккаунта и историю действий.</li>'
      + '  </ul>'
      + note('alert', '<div>Сейчас ничего из этого не хранится: данные живут в памяти вкладки и исчезают '
        + 'после перезагрузки. Текст ниже — черновик формулировок, а не готовая политика конфиденциальности.</div>')
      + '  <div class="btn-row">'
      + '    <button type="button" class="btn" data-act="data:clear-answers">Удалить ответы на вопросы</button>'
      + '    <button type="button" class="btn" data-act="data:clear-history">Очистить историю</button>'
      + '    <button type="button" class="btn btn--danger" data-act="data:reset">Сбросить демо полностью</button>'
      + '  </div>'
      + '</div>'
      + '<div class="card stack">'
      + '  <h2>Черновик о приватности</h2>'
      + '  <p class="muted">Прототип не отправляет введённый текст и выбранные файлы на сервер, не подключает '
      + '  аналитику и внешние сервисы. Формулировки будут переписаны юристом до запуска: это рабочий черновик.</p>'
      + '</div>';
  }

  return {
    match: match,
    questions: questions,
    interviews: interviews,
    interview: interview,
    voice: voice,
    assistant: assistant,
    plans: plans,
    history: history,
    settings: settings,
    locked: locked,
    ensureChat: ensureChat,
    ensureVoice: ensureVoice
  };
})();

</script>
<script>
/* ==== app.js ==== */
/* ============================================================
   Маршрутизация, отрисовка оболочки и обработка действий.
   Никаких сетевых запросов: макет работает полностью локально.
   ============================================================ */

(function () {
  'use strict';

  var esc = UI.esc;
  var root = document.getElementById('app');

  var NAV = [
    { section: 'overview', href: '#/overview', label: 'Обзор' },
    { section: 'resumes', href: '#/resumes', label: 'Мои резюме' },
    { section: 'vacancies', href: '#/vacancies', label: 'Вакансии и подготовка' },
    { section: 'interviews', href: '#/interviews', label: 'Тренировочные интервью' },
    { section: 'assistant', href: '#/assistant', label: 'Помощник на собеседовании' },
    { section: 'plans', href: '#/plans', label: 'Тарифы и лимиты' },
    { section: 'settings', href: '#/settings', label: 'Настройки и данные' }
  ];

  var PUBLIC_ROUTES = ['start', 'auth', 'onboarding'];

  /* ---------------- Работа с путями состояния ---------------- */

  function setPath(path, value) {
    var parts = path.split('.');
    var target = Store.get();
    for (var i = 0; i < parts.length - 1; i++) {
      if (target[parts[i]] === undefined || target[parts[i]] === null) return;
      target = target[parts[i]];
    }
    target[parts[parts.length - 1]] = value;
  }

  /* ---------------- Разбор маршрута ---------------- */

  function parseRoute() {
    var hash = window.location.hash.replace(/^#\/?/, '');
    var parts = hash.split('/').filter(function (p) { return p.length > 0; });
    if (!parts.length) return { name: 'start', parts: [] };
    return { name: parts[0], parts: parts };
  }

  var KNOWN = ['start', 'auth', 'onboarding', 'overview', 'resumes', 'resume', 'vacancies',
    'vacancy', 'prep', 'interviews', 'assistant', 'plans', 'history', 'settings'];

  /* ---------------- Отрисовка ---------------- */

  function screenFor(route) {
    var parts = route.parts;
    switch (route.name) {
      case 'start': return ScreensCore.start();
      case 'auth': return ScreensCore.auth(parts[1] || 'login');
      case 'onboarding': return ScreensCore.onboarding();
      case 'overview': return ScreensCore.overview();
      case 'resumes': return ScreensCore.resumes();
      case 'resume':
        if (parts[1] === 'new') return ScreensCore.resumeWizard();
        if (parts[1] === 'upload') return ScreensCore.upload();
        return ScreensCore.resumeCard(parts[1]);
      case 'vacancies': return ScreensCore.vacancies();
      case 'vacancy': return ScreensCore.vacancyNew();
      case 'prep': {
        var prepId = parts[1];
        var view = parts[2] || 'match';
        if (view === 'questions') return ScreensPrep.questions(prepId);
        if (view === 'interview') return ScreensPrep.interview(prepId);
        if (view === 'voice') return ScreensPrep.voice(prepId);
        return ScreensPrep.match(prepId);
      }
      case 'interviews': return ScreensPrep.interviews();
      case 'assistant': return ScreensPrep.assistant();
      case 'plans': return ScreensPrep.plans();
      case 'history': return ScreensPrep.history();
      case 'settings': return ScreensPrep.settings();
      default: return '';
    }
  }

  function sectionForRoute(name) {
    if (name === 'resume') return 'resumes';
    if (name === 'vacancy') return 'vacancies';
    if (name === 'prep') return 'vacancies';
    if (name === 'history') return 'settings';
    return name;
  }

  function sidebar(activeSection) {
    var links = NAV.map(function (item) {
      var allowed = Store.sectionAllowed(item.section);
      return '<a class="navlink" href="' + item.href + '"'
        + (item.section === activeSection ? ' aria-current="page"' : '') + '>'
        + '<span>' + esc(item.label) + '</span>'
        + (allowed ? '' : '<span class="navlink__lock">по тарифу</span>')
        + '</a>';
    }).join('');

    return ''
      + '<nav class="sidebar" aria-label="Основная навигация">'
      + '  <div class="sidebar__brand">'
      + '    <b>Карьерный помощник</b>'
      + '    <span class="tag tag--demo">Демо-макет</span>'
      + '  </div>'
      + '  <div class="sidebar__nav">' + links + '</div>'
      + '  <div class="sidebar__foot">'
      + '    <a class="navlink" href="#/history"><span>История</span></a>'
      + '    <a class="navlink" href="#/start"><span>Выйти из демо</span></a>'
      + '  </div>'
      + '</nav>';
  }

  function topbar() {
    var state = Store.get();
    var prep = Store.activePrep();
    var ctx = prep
      ? '<b>' + esc(ScreensCore.prepTitle(prep)) + '</b>'
        + '<button type="button" class="btn btn--sm" data-act="prep:change-sources" data-id="'
        + esc(prep.id) + '">Заменить исходники</button>'
      : '<span class="muted">Подготовка не выбрана</span>';

    return ''
      + '<div class="topbar">'
      + '  <button type="button" class="btn btn--sm menu-btn" data-act="nav:toggle" aria-label="Открыть меню">☰</button>'
      + '  <div class="topbar__ctx">' + ctx + '</div>'
      + '  <span class="tag tag--demo">'
      + '    <span class="badge-full">Демо — ИИ и платежи не подключены</span>'
      + '    <span class="badge-short">Демо</span>'
      + '  </span>'
      + '  <button type="button" class="btn btn--sm" data-act="theme:toggle" aria-label="Переключить тему">'
      + (state.theme === 'dark' ? '☀' : '☾') + '</button>'
      + '</div>';
  }

  function demoPanel() {
    var state = Store.get();
    var open = state.demoPanelOpen;
    var options = [
      { value: 'empty', label: 'Пусто' },
      { value: 'filled', label: 'Заполнено' },
      { value: 'loading', label: 'Загрузка' },
      { value: 'error', label: 'Ошибка' },
      { value: 'limit', label: 'Лимит' }
    ];
    return ''
      + '<aside class="demo-panel' + (open ? '' : ' demo-panel--collapsed') + '" aria-label="Состояния демо">'
      + '  <button type="button" class="demo-panel__head" data-act="demopanel:toggle" aria-expanded="'
      + (open ? 'true' : 'false') + '">'
      + '    <span>Состояния демо</span><span aria-hidden="true">' + (open ? '▾' : '▴') + '</span>'
      + '  </button>'
      + '  <div class="demo-panel__body">'
      + '    <label class="field" for="demo-scenario"><span class="field__label">Сценарий</span>'
      + '      <select id="demo-scenario" data-change-act="demo:scenario">'
      + options.map(function (o) {
          return '<option value="' + o.value + '"' + (o.value === state.scenario ? ' selected' : '') + '>'
            + esc(o.label) + '</option>';
        }).join('')
      + '      </select></label>'
      + '    <label class="field" for="demo-plan"><span class="field__label">Демо-тариф</span>'
      + '      <select id="demo-plan" data-change-act="demo:plan">'
      + DEMO_DATA.plans.map(function (p) {
          return '<option value="' + esc(p.id) + '"' + (p.id === state.plan ? ' selected' : '') + '>'
            + esc(p.name) + '</option>';
        }).join('')
      + '      </select></label>'
      + '    <button type="button" class="btn btn--sm btn--block" data-act="data:reset">Сбросить демо</button>'
      + '    <p style="margin-top:8px">Панель влияет только на демонстрацию и не является частью продукта.</p>'
      + '  </div>'
      + '</aside>';
  }

  function render() {
    var state = Store.get();
    var route = parseRoute();

    document.documentElement.setAttribute('data-theme', state.theme);

    if (KNOWN.indexOf(route.name) < 0) {
      window.location.hash = '#/overview';
      return;
    }

    var focusId = document.activeElement ? document.activeElement.id : null;
    var selection = null;
    if (document.activeElement && typeof document.activeElement.selectionStart === 'number') {
      selection = document.activeElement.selectionStart;
    }
    var chatLog = document.getElementById('chat-log');
    var chatAtBottom = chatLog ? true : false;

    var html;
    if (PUBLIC_ROUTES.indexOf(route.name) >= 0) {
      html = screenFor(route);
    } else {
      var section = sectionForRoute(route.name);
      var content = Store.sectionAllowed(section) || section === 'settings' || section === 'plans'
        ? screenFor(route)
        : ScreensPrep.locked(navLabel(section), section === 'assistant' ? 'assistant' : 'training');
      html = ''
        + '<div class="shell">'
        + sidebar(section)
        + '  <div class="main">' + topbar()
        + '    <main class="content" id="main" tabindex="-1">' + content + '</main>'
        + '  </div>'
        + '</div>'
        + (document.body.getAttribute('data-nav') === 'open'
            ? '<button type="button" class="nav-scrim" data-act="nav:close" aria-label="Закрыть меню"></button>' : '')
        + demoPanel();
    }

    root.innerHTML = html + UI.renderModal(state.modal) + UI.renderToasts(state.toasts);

    if (state.modal) UI.trapFocus(root);
    if (focusId && !state.modal) {
      var node = document.getElementById(focusId);
      if (node && typeof node.focus === 'function') {
        node.focus();
        if (selection !== null && typeof node.setSelectionRange === 'function') {
          try { node.setSelectionRange(selection, selection); } catch (e) { /* не текстовое поле */ }
        }
      }
    }
    var newLog = document.getElementById('chat-log');
    if (newLog && chatAtBottom) newLog.scrollTop = newLog.scrollHeight;
    bindFileInput();
  }

  function navLabel(section) {
    for (var i = 0; i < NAV.length; i++) {
      if (NAV[i].section === section) return NAV[i].label;
    }
    return 'Раздел';
  }

  /* ---------------- Локальный выбор файла ---------------- */

  function bindFileInput() {
    var input = document.getElementById('file-input');
    var zone = document.getElementById('dropzone');
    if (!input) return;

    input.addEventListener('change', function () {
      if (input.files && input.files[0]) {
        Store.update(function (s) { s.upload.fileName = input.files[0].name; });
        UI.toast('Файл выбран локально. Он не отправляется и не читается макетом.');
      }
    });

    if (!zone) return;
    ['dragenter', 'dragover'].forEach(function (type) {
      zone.addEventListener(type, function (event) {
        event.preventDefault();
        zone.classList.add('dropzone--over');
      });
    });
    ['dragleave', 'drop'].forEach(function (type) {
      zone.addEventListener(type, function (event) {
        event.preventDefault();
        zone.classList.remove('dropzone--over');
      });
    });
    zone.addEventListener('drop', function (event) {
      var files = event.dataTransfer && event.dataTransfer.files;
      if (files && files[0]) {
        Store.update(function (s) { s.upload.fileName = files[0].name; });
        UI.toast('Файл выбран локально. Он не отправляется и не читается макетом.');
      }
    });
  }

  /* ---------------- Действия ---------------- */

  function go(hash) {
    if (window.location.hash === hash) render();
    else window.location.hash = hash;
  }

  function dispatch(act, data, element) {
    var state = Store.get();

    if (act.indexOf('go:') === 0) {
      var target = act.slice(3);
      if (data.prep) state.activePrepId = data.prep;
      go(target);
      return;
    }

    switch (act) {
      /* -------- Оболочка -------- */
      case 'nav:toggle':
        document.body.setAttribute('data-nav',
          document.body.getAttribute('data-nav') === 'open' ? 'closed' : 'open');
        render();
        return;
      case 'nav:close':
        document.body.setAttribute('data-nav', 'closed');
        render();
        return;
      case 'theme:toggle':
        Store.setPref('theme', state.theme === 'dark' ? 'light' : 'dark');
        return;
      case 'demopanel:toggle':
        Store.setPref('demoPanelOpen', !state.demoPanelOpen);
        return;
      case 'rerender':
        Store.notify();
        return;

      /* -------- Диалоги -------- */
      case 'modal:backdrop':
        if (element && element.classList.contains('modal-backdrop')) UI.closeModal();
        return;
      case 'modal:close':
        UI.closeModal();
        return;
      case 'modal:confirm': {
        var modal = state.modal;
        UI.closeModal();
        if (modal && modal.confirmAct) dispatch(modal.confirmAct, modal.confirmData || {});
        return;
      }

      /* -------- Демо-режим -------- */
      case 'demo:example':
        Store.applyScenario('filled');
        go('#/overview');
        UI.toast('Открыт пример заполненного демо.');
        return;
      case 'demo:scenario-empty':
        Store.applyScenario('empty');
        UI.toast('Показано пустое состояние.');
        return;
      case 'demo:scenario-filled':
        Store.applyScenario('filled');
        UI.toast('Показано заполненное состояние.');
        return;
      case 'demo:scenario-limit':
        Store.get().scenario = 'limit';
        Store.setPref('scenario', 'limit');
        go('#/vacancies');
        return;
      case 'data:reset':
        Store.resetDemo();
        UI.toast('Демо сброшено к исходному состоянию.');
        return;
      case 'data:clear-answers':
        UI.confirm({

          ];

        return;

        });
        return;
      case 'stub:profile-save':
        UI.toast('Профиль не сохраняется: макет не хранит персональные данные.');
        return;

      default:
        return;
    }
  }

  function sourcesModalBody(prep) {
    var state = Store.get();
    var resumeOptions = state.resumes.map(function (r) { return { value: r.id, label: r.title }; });
    var vacancyOptions = state.vacancies.map(function (v) { return { value: v.id, label: v.title + ' — ' + v.company }; });
    return ''
      + '<p class="muted">Если заменить резюме или вакансию, прежний демонстрационный отчёт будет помечен '
      + 'как относящийся к предыдущей версии.</p>'
      + UI.select({ id: 'src-resume', label: 'Резюме', value: prep.resumeId,
          options: resumeOptions.length ? resumeOptions : [{ value: '', label: 'Резюме нет' }],
          act: 'prep:set-resume' })
      + UI.select({ id: 'src-vacancy', label: 'Вакансия', value: prep.vacancyId,
          options: vacancyOptions.length ? vacancyOptions : [{ value: '', label: 'Вакансий нет' }],
          act: 'prep:set-vacancy' });
  }

  /* ---------------- Обработчики событий ---------------- */

  document.addEventListener('click', function (event) {
    var element = event.target.closest('[data-act]');
    if (!element) return;
    var act = element.getAttribute('data-act');
    if (act === 'modal:backdrop' && event.target !== element) return;
    if (element.tagName === 'A') return;
    if (element.hasAttribute('disabled') || element.getAttribute('aria-disabled') === 'true') return;
    event.preventDefault();
    dispatch(act, {
      id: element.getAttribute('data-id'),
      index: element.getAttribute('data-index'),
      step: element.getAttribute('data-step'),
      plan: element.getAttribute('data-plan'),
      prep: element.getAttribute('data-prep'),
      status: element.getAttribute('data-status')
    }, element);
  });

  /* Ввод текста не вызывает перерисовку: фокус и каретка остаются на месте. */
  document.addEventListener('input', function (event) {
    var element = event.target;
    var model = element.getAttribute && element.getAttribute('data-model');
    if (!model) return;
    if (model === 'chatDraft') {
      var prep = Store.activePrep();
      if (prep && prep.chat) prep.chat.draft = element.value;
      return;
    }
    setPath(model, element.value);
  });

  document.addEventListener('change', function (event) {
    var element = event.target;
    if (element.getAttribute && element.getAttribute('data-toggle')) {
      var key = element.getAttribute('data-toggle');
      Store.update(function (s) { s.settings[key] = element.checked; });
      UI.toast('Переключатель изменён локально: уведомления не отправляются.');
      return;
    }
    var act = element.getAttribute && element.getAttribute('data-change-act');
    if (!act) return;
    var model = element.getAttribute('data-model');
    if (model) setPath(model, element.value);
    dispatch(act, { value: element.value }, element);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && Store.get().modal) {
      UI.closeModal();
    }
  });

  window.addEventListener('hashchange', function () {
    document.body.setAttribute('data-nav', 'closed');
    render();
    var main = document.getElementById('main');
    if (main) main.scrollIntoView({ block: 'start' });
  });

  Store.subscribe(render);

  /* ---------------- Запуск ---------------- */

  if (!window.location.hash) window.location.hash = '#/start';
  render();
  window.setTimeout(function () {
    UI.toast('Демо-макет: введённые данные хранятся только в этой вкладке и сбрасываются после перезагрузки.');
  }, 600);
})();

</script>
</body>
</html>
